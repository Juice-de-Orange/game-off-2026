# kestrel9.maxlworks.com - the game (P49, docs/DEPLOY.md). Installed as /etc/nginx/sites-available/kestrel9.
#
# Same shape as the other sites on Geoffrey: port 443 belongs to the stream SNI router
# (modules-enabled/60-stream-pete.conf), which forwards this name to 127.0.0.1:8447 with proxy_protocol.
# No access log, and an error log without everyday client errors: the privacy policy promises no logging beyond the
# stream router log, and nginx writes client IPs into error lines (e.g. a 502 while the container restarts).

server {
    listen 80;
    listen [::]:80;
    server_name kestrel9.maxlworks.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kestrel9.maxlworks.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8447 ssl http2 proxy_protocol;
    server_name kestrel9.maxlworks.com;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/kestrel9.maxlworks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kestrel9.maxlworks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kestrel9_ssl:1m;
    ssl_session_timeout 1d;

    access_log off;
    error_log  /var/log/nginx/kestrel9.error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # P84: the client address for the bug report rate limit (kept in memory only). Set, not appended, so it can't be faked.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
