# The live version on Geoffrey (P49, docs/DEPLOY.md). Installed as /opt/kestrel9/compose.yml; deploy.sh writes the tag into .env.
# Reachable only through the host nginx (deploy/server/nginx-site.conf).
name: kestrel9
services:
  web:
    image: kestrel9:${KESTREL9_TAG:?run through deploy.sh}
    pull_policy: never
    container_name: kestrel9-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18092:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    labels:
      # A local image can't be pulled; updates come only through deploy.sh.
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # P84: in-game bug reports → GitHub issues (deploy/reports). Build the image on Geoffrey before this file goes live:
  # docker build -t kestrel9-reports:latest /opt/kestrel9/reports. Token: python deploy/set-report-token.py (writes reports.env).
  reports:
    image: kestrel9-reports:latest
    pull_policy: never
    container_name: kestrel9-reports
    restart: unless-stopped
    env_file:
      - path: reports.env
        required: false
    read_only: true
    # P129: play metrics as JSONL per day (90 days). The folder must belong to uid 10001: see docs/DEPLOY.md.
    volumes:
      - ./metrics:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
