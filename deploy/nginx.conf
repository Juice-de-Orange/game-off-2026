# The build uses Decompression Fallback: Unity's loader unpacks the .unityweb files itself, so no Content-Encoding headers here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The privacy policy of maxlworks.com promises no access logging.
    access_log off;
    log_not_found off;

    types {
        text/html html;
        text/plain txt;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        image/png png;
        image/jpeg jpg;
        application/xml xml;
        application/octet-stream unityweb data;
    }

    # File names don't change between builds: revalidate on every visit (ETag), so a new version shows at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # P84: in-game bug reports go to the reports container (deploy/reports). The variable makes nginx look the name up per
    # request, so the game still starts and loads when that container is down (a report then fails with 502).
    # X-Forwarded-For is set (not appended) by the host nginx; it only feeds the backend's in-memory rate limit.
    location = /api/report {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reports http://reports:8000;
        proxy_pass $reports;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        client_max_body_size 8k;
        proxy_read_timeout 30s;
    }

    # P129: anonymous play metrics, same container. Without it (container down) the game gets 502 and keeps trying every 30 s.
    location = /api/metrics {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reports http://reports:8000;
        proxy_pass $reports;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For "";  # the backend never sees the player's IP
        client_max_body_size 64k;
        proxy_read_timeout 15s;
    }
}
