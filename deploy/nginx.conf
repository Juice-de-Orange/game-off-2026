# The build uses Decompression Fallback: Unity's loader unpacks the .unityweb files itself, so no Content-Encoding headers here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The privacy policy of maxlworks.com promises no access logging.
    access_log off;
    log_not_found off;

    types {
        text/html html;
        text/plain txt;
        text/css css;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream unityweb data;
    }

    # File names don't change between builds: revalidate on every visit (ETag), so a new version shows at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
