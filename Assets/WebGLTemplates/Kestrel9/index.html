<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Kestrel-9 – a customs night shift in orbit, free in the browser</title>
    <meta name="description" content="Free browser game: work the night shift at a run-down customs station in orbit. Check papers, arrest smugglers, keep your family back home alive.">
    <link rel="canonical" href="https://kestrel9.maxlworks.com/">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Maxlworks">
    <meta property="og:title" content="Kestrel-9 – Customs &amp; Excise · Night Shift">
    <meta property="og:description" content="A night shift at a customs station in orbit. Made for GitHub Game Off 2026, playable in the browser.">
    <meta property="og:url" content="https://kestrel9.maxlworks.com/">
    <meta property="og:image" content="https://kestrel9.maxlworks.com/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0b0d10">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Kestrel-9",
        "url": "https://kestrel9.maxlworks.com/",
        "image": "https://kestrel9.maxlworks.com/og.jpg",
        "description": "A first-person customs game: on a small, run-down space station you check travelers' papers and luggage, let them pass, arrest them or open the airlock, and keep your family back home alive.",
        "genre": ["Simulation", "Puzzle"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "playMode": "SinglePlayer",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "author": [{ "@type": "Organization", "name": "Maxlworks", "url": "https://maxlworks.com/" }, { "@type": "Person", "name": "iMaterix" }],
        "subjectOf": { "@type": "WebPage", "url": "https://maxlworks.com/games/kestrel-9/" }
      }
    </script>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0d10; color: #8b9096; font: 12px/20px monospace; overflow: hidden; }
      body { display: flex; flex-direction: column; }
      #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
      /* The menus are laid out for 16:9 (reference 960x540): keep that shape, narrow windows get bars instead of cut-off menus */
      #unity-canvas { display: block; width: min(100%, calc((100vh - 20px) * 16 / 9)); aspect-ratio: 16 / 9; outline: none; background: #0b0d10; }
      #loading { position: absolute; top: 50%; left: 50%; width: min(320px, 70%); transform: translate(-50%, -50%); text-align: center; }
      #loading h1 { margin: 0 0 4px; font-size: 20px; line-height: 28px; font-weight: normal; letter-spacing: 0.12em; color: #ffd46b; }
      #loading p { margin: 0 0 16px; }
      #track { height: 4px; margin-top: 8px; background: #2b3037; }
      #bar { width: 0; height: 100%; background: #ffd46b; }
      #error { color: #ffb74d; }
      footer { flex: none; height: 20px; padding: 0 8px; text-align: right; }
      footer a { color: inherit; margin-left: 12px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <h1>KESTREL-9</h1>
        <p>Customs &amp; Excise · Night Shift. Check travelers' papers at a run-down station in orbit and keep your family back home alive.</p>
        <noscript><p>The game needs JavaScript and WebGL.</p></noscript>
        <span id="status">Loading…</span><div id="track"><div id="bar"></div></div>
      </div>
    </div>
    <footer>
      <span>Test build: sends anonymous play statistics (no IP, no cookies) to improve the game.</span>
      <a href="https://maxlworks.com/games/kestrel-9/">About the game</a>
      <a href="https://maxlworks.com/legal/imprint/">Imprint</a>
      <a href="https://maxlworks.com/legal/privacy/">Privacy</a>
    </footer>
    <script>
      function showError(message) {
        var status = document.querySelector("#status");
        status.id = "error";
        status.textContent = "The game could not start: " + message;
        document.querySelector("#track").remove();
      }
    </script>
    <script>
      // P129: one anonymous "visit" per page load, so the play metrics also count people who leave while the game loads and
      // where they came from (?src=... in the link, else the referring site's host name). The random id goes to the game
      // (Browser.jslib) so visit and play are one session. Nothing is stored in the browser.
      (function () {
        var bytes = new Uint8Array(6);
        crypto.getRandomValues(bytes);
        var id = Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
        window.K9_SESSION = id;
        var src = (new URLSearchParams(location.search).get("src") || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 32);
        var ref = "";
        try { ref = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}
        var visit = { e: "visit", t: 0, src: src, ref: ref, mobile: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent), w: innerWidth, h: innerHeight };
        try {
          fetch("https://kestrel9.maxlworks.com/api/metrics", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
            body: JSON.stringify({ session: id, version: {{{ JSON.stringify(PRODUCT_VERSION) }}}, events: [visit] }) }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}" onerror="showError('the download failed. Please reload the page.')"></script>
    <script>
      if (window.createUnityInstance) createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Browsers may refuse the mouse lock (window not focused, just after Esc). Unity's loader would stop the game with an
        // alert for that; the next click locks anyway. True = handled, every other error still reaches the player.
        errorHandler: function (message) { return /pointer ?lock|exited the lock/i.test(String(message)); },
      }, function (progress) {
        document.querySelector("#bar").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
      }).catch(showError);
    </script>
  </body>
</html>
